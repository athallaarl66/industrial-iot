# =================================================================
# Mosquitto MQTT Broker Enterprise Configuration
# =================================================================

# 1. Listeners
listener 1883
protocol mqtt

# WebSocket support (Required for React frontend if direct connection is needed later, though we plan to use SignalR, good to have)
listener 9001
protocol websockets

# 2. Security & Authentication (HTTP Webhook Auth via Go-Auth Plugin)
allow_anonymous false

auth_plugin /mosquitto/go-auth.so
auth_opt_backends http

# Webhook Connection Details (internal docker network)
auth_opt_http_host iot_backend_api
auth_opt_http_port 8080
auth_opt_http_getuser_uri /api/v1/edge/auth
auth_opt_http_superuser_uri /api/v1/edge/superuser
auth_opt_http_acl_uri /api/v1/edge/acl
auth_opt_http_params_mode json
auth_opt_http_response_mode status

# 3. Persistence (Data Retention in Edge)
persistence true
persistence_location /mosquitto/data/

# 4. Logging
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
