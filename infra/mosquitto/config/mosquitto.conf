# =================================================================
# Mosquitto MQTT Broker Enterprise Configuration
# =================================================================

# 1. Listeners
listener 1883
protocol mqtt

# WebSocket support (Required for React frontend if direct connection is needed later, though we plan to use SignalR, good to have)
listener 9001
protocol websockets

# 2. Security & Authentication (Zero Trust)
allow_anonymous true
# password_file /mosquitto/config/passwords.txt

# 3. Persistence (Data Retention in Edge)
persistence true
persistence_location /mosquitto/data/

# 4. Logging
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
